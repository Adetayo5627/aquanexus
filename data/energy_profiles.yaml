# energy_profiles.yaml
#
# Energy configurations are now defined by INFRASTRUCTURE SIZING, not by a
# flat "% renewable" shortcut (second review: a flat penetration percentage
# ignores hour of day, irradiance, capacity, battery state of charge and
# curtailment). Each profile sizes PV and battery relative to the facility's
# average electrical load, and models/dispatch.py simulates a 24-hour day.
#
# pv_mw_per_avg_load_mw : PV nameplate MW per MW of the facility's average load
# battery_hours         : battery energy capacity in hours of average load
# solar_lcoe_usd_per_kwh: levelized cost of PV energy GENERATED (including
#   any curtailed energy, which is still paid for). Gulf utility-scale solar
#   PPAs have been publicly reported as low as $0.0132-0.0135/kWh (Abu Dhabi
#   Al Dhafra, 2020); the value here is a deliberately higher generic
#   regional estimate. ENGINEERING ASSUMPTION.
# Battery cost is handled separately (annualized capex, see models/cost.py).
# All values are engineering assumptions (confidence: estimated).

grid_only:
  label: "Grid electricity only"
  pv_mw_per_avg_load_mw: 0.0
  battery_hours: 0.0
  solar_lcoe_usd_per_kwh: 0.0
  grid_constraint_sensitivity: high
  confidence: estimated

grid_plus_solar:
  label: "Grid + solar PV"
  pv_mw_per_avg_load_mw: 1.3
  battery_hours: 0.0
  solar_lcoe_usd_per_kwh: 0.025
  grid_constraint_sensitivity: medium
  confidence: estimated
  note: "PV sized at 1.3 MW per MW of average load; with no storage, solar can only serve load while the sun is up."

grid_plus_solar_plus_storage:
  label: "Grid + solar PV + battery storage"
  pv_mw_per_avg_load_mw: 2.2
  battery_hours: 4.0
  solar_lcoe_usd_per_kwh: 0.025
  grid_constraint_sensitivity: low
  confidence: estimated
  note: "Larger PV array plus 4 hours of battery storage; surplus solar charges the battery and discharges after sunset."
