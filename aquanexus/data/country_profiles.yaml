# country_profiles.yaml
#
# CONFIDENCE LEVELS used throughout this file:
#   sourced    = directly reported by a named primary source
#   derived    = calculated/interpolated from a sourced figure
#   estimated  = reasoned engineering assumption, specific to this country where noted
#   generic    = a region-wide (not country-specific) literature-derived value, reused
#                across countries because no country-specific figure was found
#
# UPDATE: electricity prices for all seven countries are now sourced from
# GlobalPetrolPrices.com business-rate data (Q4 2025 collection round), a
# commercial price-tracking service that compiles data from each country's
# electricity regulator/utility. This is a third-party aggregator, not each
# country's primary utility document directly, so confidence is "sourced"
# with that caveat stated rather than "primary source verified."
#
# Water stress scores are sourced directly from WRI for UAE, Saudi Arabia,
# and Qatar (all three are named in WRI's "extremely high," 5.0/5.0 group).
# Jordan, Morocco, Algeria, and Tunisia do not have a specific WRI score
# confirmed in this project's research, so their water_stress_score_0_100
# is left null. Where null, the resilience model substitutes a neutral
# midpoint (50) and flags this explicitly in the dashboard, rather than
# guessing a country-specific number.

UAE:
  capital_key: "UAE"                    # key into models/live_data.py COUNTRY_CAPITALS
  ambient_temperature_normal_c: 35      # static fallback if live climate fetch fails
  ambient_temperature_confidence: estimated
  water_stress_score_0_100: 100
  water_stress_confidence: sourced
  water_stress_source: "WRI Aqueduct 4.0 Projected Water Stress Country Rankings (2023): UAE named among 9-11 countries scoring 5.0/5.0, extremely high"
  grid_carbon_intensity_g_per_kwh:
    abu_dhabi: 280
    abu_dhabi_confidence: derived
    abu_dhabi_source: "EWEC Statement of Future Capacity Requirements 2024-2037"
    dubai: 420
    dubai_confidence: estimated
    dubai_source: "DEWA 2023 operational disclosures (renewable capacity share); exact grid emission factor should be pulled from DEWA Sustainability Report directly"
  electricity_price_usd_per_kwh: 0.084
  electricity_price_confidence: derived
  electricity_price_source: "DEWA published industrial tariff (AED 0.230/kWh) plus fuel surcharge (~AED 0.065/kWh) and 5% VAT, converted at AED/USD peg, cross-checked against third-party DEWA bill explainer sites, 2026"
  desalination_sec_kwh_per_m3: {value_min: 3.0, value_max: 4.0, confidence: generic}
  desalination_share_of_supply_pct: {value_min: 40, value_max: 95, confidence: estimated}
  solar_capacity_factor_pct: 22
  solar_capacity_factor_confidence: estimated

