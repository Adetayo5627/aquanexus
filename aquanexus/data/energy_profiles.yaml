# energy_profiles.yaml
# Energy configuration parameters. Confidence: estimated unless noted.

grid_only:
  label: "Grid electricity only"
  renewable_penetration_pct: 0
  grid_constraint_sensitivity: high
  relative_cost_multiplier: 1.0
  confidence: estimated

grid_plus_solar:
  label: "Grid + solar PV"
  renewable_penetration_pct: 30       # daytime-weighted estimate; editable
  grid_constraint_sensitivity: medium
  relative_cost_multiplier: 0.92
  confidence: estimated
  note: "Renewable penetration is a simplified daily-average estimate, not an hourly dispatch simulation, in this MVP."

grid_plus_solar_plus_storage:
  label: "Grid + solar PV + battery storage"
  renewable_penetration_pct: 45
  grid_constraint_sensitivity: low
  relative_cost_multiplier: 1.05      # storage capex raises relative cost despite lower grid dependence
  battery_round_trip_efficiency_pct: 90
  confidence: estimated
  note: "Storage shifts solar generation into non-daylight hours; simplified as a flat renewable-penetration uplift in this MVP, not a full dispatch model."
